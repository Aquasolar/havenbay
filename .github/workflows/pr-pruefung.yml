name: Prüfung vor dem Zusammenführen

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests Ebene 1 (Rechenlogik, Plausibilität, Preisdatei, Kalender)
        run: |
          python -m pip install --quiet pillow
          python tests/test_sync.py
          node tests/test_app.js
          node tests/test_plausibility.js
          node tests/test_prices.js
      - name: Tests Ebene 2 (Browser-Test mit Beispielkalender)
        run: |
          python build.py --availability tests/fixtures/availability.json --out build/e2e-dist
          python tests/test_dist.py build/e2e-dist
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          node tests/e2e.js build/e2e-dist
